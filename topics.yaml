# -----------------------------
# Notes for Curators
# -----------------------------
notes: |
  • This vocabulary is bibliography-facing: attach tags to cited works and author profiles.
  • Book-specific metaphysical ideas (e.g., Diamond Luminosity, Future Human) belong in the Bache Graph concepts layer, not here.
  • Keep tags lowercase, singular nouns/noun-phrases. Prefer canonical forms in `topics`, but `aliases` are accepted and normalized by CI.
  • Typical mappings from the current reference list:
      - Grof corpus → perinatal matrices (bpm); psychedelic therapy; spiritual emergency; archetypal astrology
      - Pahnke/Richards/Griffiths (2008) → research safety & ethics; psychedelic therapy
      - Shulgin, Trachsel, Ott → psychedelic chemistry; tryptamines; 5-meo-dmt (for Oroc)
      - Metzner, Alverga, St John → ayahuasca studies; entheogens & religion
      - Underhill, Stace, Zaehner, Huston Smith → comparative mysticism; philosophy of religion
      - Aurobindo, Satprem → vedic philosophy; integral yoga
      - Tarnas (Cosmos & Psyche), Archai papers → archetypal astrology
      - Stevenson, Tucker, Bowman, Whitton, Wambach, Weiss, Snow → reincarnation research; children’s past-life reports; life-between-lives; hypnosis & regression therapy; xenoglossy
      - van Lommel, Ring/Valarino → near-death studies
      - Monroe → out-of-body experiences
      - Rowan, Watkins, Emmerson, Zinser → subpersonalities & ego states; hypnosis & regression therapy; subtle energy psychology
      - Laszlo (Akashic), Sheldrake → connectivity & akashic models
      - Meadows/Randers, Korten, Hawken, Gilding, Wallace-Wells → systems dynamics & limits to growth; ecological economics & inequality; climate change
      - Scientific American (2014), Pollan (2018), Shroder (2014) → clinical renaissance; science communication; prohibition & policy
      - James, Husserl, Dante → pragmatism & psychology; phenomenology; literature & spiritual classics
