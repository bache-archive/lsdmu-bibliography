# Author Object Schema — LSDMU Bibliography
# Version 1.1  |  Date: 2025-11-01
# Change log:
#  - Added optional fields: viaf, openalex
#  - Updated description of identifier fields for clarity

$schema: "http://json-schema.org/draft-07/schema#"
title: "Author Object Schema"
type: object
required:
  - id
  - full_name
properties:
  id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "Canonical author slug (family-given)"
  full_name:
    type: string
  lifespan:
    type: string
    description: "Optional (e.g., 1886–1967)"
  nationality:
    type: string
  fields:
    type: array
    items:
      type: string
  wikidata:
    type: string
    description: "Wikidata QID for this author (e.g., Q112496741)"
  viaf:
    type: string
    description: "VIAF ID for this author (e.g., 102412231)"
  openalex:
    type: string
    description: "OpenAlex author identifier (e.g., A5045900737)"
  orcid:
    type: string
    description: "ORCID iD (if available)"
  notable_works:
    type: array
    items:
      type: string
  notes:
    type: string
  curator:
    type: string
    description: "Curator or steward who created this record"
additionalProperties: false